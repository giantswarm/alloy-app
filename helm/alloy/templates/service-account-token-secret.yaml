{{- if and .Values.alloy.enabled .Values.serviceAccountTokenSecret.enabled }}
{{- if not (.Values.alloy.serviceAccount).create }}
{{- fail "serviceAccountTokenSecret.enabled requires alloy.serviceAccount.create to be true" }}
{{- end }}
{{- $saName := (.Values.alloy.serviceAccount).name | default (include "alloy.fullname" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $saName }}-token
  labels:
    {{- include "alloy.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
  annotations:
    kubernetes.io/service-account.name: {{ $saName }}
# Must live in the same release as the ServiceAccount: the token controller deletes
# service-account-token Secrets whose ServiceAccount is missing.
type: kubernetes.io/service-account-token
{{- end }}
