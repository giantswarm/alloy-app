{{- if and .Values.alloy.enabled (include "vcenter-receiver.enabled" .) }}
{{/* Allows the otelcol.receiver.vcenter component to read the vCenter credentials secret. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "alloy.fullname" . }}-vcenter-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alloy.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
rules:
- apiGroups:
  - ""
  resourceNames:
  - {{- .Values.vcenterReceiver.secretName | quote }}
  resources:
  - secrets
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "alloy.fullname" . }}-vcenter-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "alloy.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "alloy.fullname" . }}-vcenter-receiver
subjects:
- kind: ServiceAccount
  name: {{ include "alloy.serviceAccountName" (dict "Values" .Values.alloy "Chart" .Chart "Release" .Release) }}
  namespace: {{ .Release.Namespace }}
{{- end }}
